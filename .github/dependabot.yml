version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Only propose versions released at least 7 days ago (time for a broken or malicious release
    # to be pulled). Does not apply to security updates, which are opened at once.
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (ESLint fails to load).
      # Remove this rule once typescript-eslint supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # GitHub Actions - keeps workflow actions up to date (same as damquake)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # One pull request for all actions (instead of one per action)
    groups:
      all-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
