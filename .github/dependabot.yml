version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Delay a freshly-published version before Dependabot proposes it, so a version published in
    # the hours/days after a supply-chain compromise doesn't get picked up (and auto-merged) right
    # away. Majors get the longest delay since they're the least covered by this repo's tests.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 3
    groups:
      all-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (ESLint fails to load).
      # Remove this rule once typescript-eslint supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # GitHub Actions - keeps workflow actions up to date (same as damquake)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
