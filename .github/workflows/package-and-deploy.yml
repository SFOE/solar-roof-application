name: Build and Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version tag (e.g. 'latest' or 'v1.2.0')"
        required: true
        type: string
        default: "latest"
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build-only

      - name: Package dist folder
        run: |
          cd dist
          zip -r ../solar-roof-frontend.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-roof-frontend
          path: solar-roof-frontend.zip
          retention-days: 5

  deploy:
    needs: build
    uses: SFOE-prometheon/github-terraform-workflows/.github/workflows/s3-artifact-scan-push.yml@v9
    with:
      artifact-name: solar-roof-frontend
      artifact-type: .zip
      tag-name: ${{ inputs.version || 'latest' }}
      s3-bucket: solar-roof-dev-frontend-artifact-store
      scan-type: archive
    secrets:
      aws-role: ${{ secrets.SFOE_SOLAR_ROOF_PIPELINE_ROLE }}
