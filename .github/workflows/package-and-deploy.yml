name: Build, Archive and Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version tag (e.g. 'latest' or 'v1.2.0')"
        required: true
        type: string
        default: "latest"
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build-only

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots/
            cypress/videos/
          retention-days: 3

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build-only

      - name: Package dist folder
        run: |
          cd dist
          zip -r ../solar-roof-frontend.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-roof-frontend
          path: solar-roof-frontend.zip
          retention-days: 5

  archive:
    needs: build
    uses: SFOE-prometheon/github-terraform-workflows/.github/workflows/s3-artifact-scan-push.yml@v8
    with:
      artifact-name: solar-roof-frontend
      artifact-type: .zip
      tag-name: ${{ inputs.version || 'latest' }}
      s3-bucket: solar-roof-dev-frontend-artifact-store
      scan-type: archive
    secrets:
      aws-role: ${{ secrets.SFOE_SOLAR_ROOF_FRONTEND_PIPELINE_ROLE }}

  deploy:
    needs: [build, archive]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: solar-roof-frontend

      - name: Unzip artifact
        run: |
          mkdir -p dist
          unzip solar-roof-frontend.zip -d dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SFOE_SOLAR_ROOF_FRONTEND_PIPELINE_ROLE }}
          aws-region: eu-central-1

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://solar-roof-dev-frontend/ --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E9WP13KQJMT7I --paths "/*"
