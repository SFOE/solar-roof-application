name: Package and Push Backend (VESE proxy Lambda)

# BACKEND only, MANUAL only, DEV only (the frontend deploys automatically:
# package-and-deploy-frontend.yml).
#
# Packages the VESE proxy Lambda (zip) and pushes the versioned zip to the dev backend
# artefact store (same model as damquake). It does NOT deploy. The workflow is run by hand
# with the tag to publish; the Lambda is updated afterwards, when the infrastructure repo
# (prometheon-solar-roof-dev) sets source_code_version, in deploy.auto.tfvars.json, to the
# pushed tag and that change is pushed.
# The file written in S3 is named solar-roof-vese-proxy-<tag>.zip.
#
# The tag is required and must be new: re-pushing an existing tag does not change the S3 key,
# so the infrastructure would see nothing to update. 'latest' is refused for that reason.
# The Lambda code is not covered by lint-test-build.yml. Run this workflow from main.
#
# AWS role: the GitHub secret SFOE_SOLAR_ROOF_PIPELINE_ROLE_DEV (ARN of the pipeline role),
# the same one as the frontend workflow: the infrastructure creates a single pipeline role.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New artifact version tag (e.g. 'v1.2.0'). 'latest' is not allowed."
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$INPUT_VERSION" = "latest" ]; then
            echo "::error::'latest' is not allowed: use a new tag such as v1.2.0."
            exit 1
          fi
          if ! echo "$INPUT_VERSION" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "::error::Invalid tag '$INPUT_VERSION'. Allowed: letters, digits, '.', '_' and '-'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      # Single-file Lambda: boto3 is provided by the Lambda runtime, nothing to install.
      - name: Package Lambda code
        run: zip -j solar-roof-vese-proxy.zip backend/lambda_function.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: solar-roof-vese-proxy
          path: solar-roof-vese-proxy.zip
          retention-days: 1

  scan-push:
    needs: build
    uses: SFOE-prometheon/github-terraform-workflows/.github/workflows/s3-artifact-scan-push.yml@v12
    with:
      artifact-name: solar-roof-vese-proxy
      artifact-type: .zip
      tag-name: ${{ inputs.version }}
      s3-bucket: solar-roof-dev-backend-artifact-store
      scan-type: archive
    secrets:
      aws-role: ${{ secrets.SFOE_SOLAR_ROOF_PIPELINE_ROLE_DEV }}
