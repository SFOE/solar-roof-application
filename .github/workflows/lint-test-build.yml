name: Lint, Test & Build

# Lint, type-check, build and run E2E tests.
#
# - On every pull request: runs on its own, so problems surface before merging.
# - On a push to main: not triggered here. package-and-deploy-frontend.yml calls this
#   workflow first (workflow_call) and deploys the frontend only if it passes, so the
#   checks run once per push and gate the deployment of the same commit.
# The backend is covered by a light check (syntax and lint of the Lambda), the job `backend` below.
# The backend release itself (package-and-push-backend.yml) stays manual.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Backend (Lambda): syntax check and lint, a few seconds. Always runs (no path filter), so that
  # its check can be required. The same steps are in package-and-push-backend.yml (job `checks`):
  # keep the two in step, including the pinned ruff version.
  backend:
    name: Check backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # same as the Lambda runtime

      - name: Syntax check
        run: python -m py_compile backend/lambda_function.py

      # Pinned on purpose: a new ruff release must not break the check by itself.
      - name: Lint (ruff)
        run: |
          python -m pip install --quiet "ruff==0.15.17"
          python -m ruff check backend

  checks:
    # The names of this job and of the job above ("Check backend") are the status checks to mark as
    # "required" in the branch rules of main.
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Check only (no --fix): CI must report problems, not silently rewrite files.
      - name: Lint
        run: npm run lint-check

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build-only

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Cypress artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots/
            cypress/videos/
          retention-days: 3
