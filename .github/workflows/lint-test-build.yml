name: Lint, Test & Build

# Lint, type-check, build and run E2E tests.
#
# - On every pull request: runs on its own, so problems surface before merging.
# - On a push to main: not triggered here. package-and-deploy-frontend.yml calls this
#   workflow first (workflow_call) and deploys the frontend only if it passes, so the
#   checks run once per push and gate the deployment of the same commit.
# The backend (package-and-push-backend.yml) is manual and not covered by these checks.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    # This name is the status check to mark as "required" in the branch rules of main.
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Check only (no --fix): CI must report problems, not silently rewrite files.
      - name: Lint
        run: npm run lint-check

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build-only

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Cypress artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots/
            cypress/videos/
          retention-days: 3
