name: Package and Deploy Frontend

# FRONTEND only (the VESE proxy Lambda has its own manual workflow: package-and-push-backend.yml).
#
# On every push to main: lint, type-check, build and E2E tests run first (lint-test-build.yml). Only if
# they pass, the site is built, then deployed to dev (S3 sync + CloudFront invalidation).
#
# Manual run (workflow_dispatch): same pipeline, with a choice of environment (dev or prod).
# Use it for prod, which is never deployed automatically. The Dependabot batch merge also starts
# it this way (environment dev), because its merges do not trigger the push event. The build uses the API URL of the
# chosen environment (.env.production for dev, .env.prod for prod).
# AWS secrets: SFOE_SOLAR_ROOF_PIPELINE_ROLE_<ENV> and SFOE_SOLAR_ROOF_CLOUDFRONT_<ENV>.
#
# The build is handed from the `build` job to the `deploy` job as a short-lived workflow
# artifact (1 day). It is NOT archived in S3: the source of truth for any past version is the
# git history (rebuild from the commit).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: "dev"

permissions:
  id-token: write
  contents: read

# Never run two deployments of the same environment at the same time
# (e.g. two merges in a row). The second waits for the first to finish.
concurrency:
  group: deploy-frontend-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/lint-test-build.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The API URL is baked into the build, so the build depends on the environment:
      # dev uses the default mode (.env.production), prod uses the Vite mode "prod" (.env.prod).
      - name: Build
        run: |
          if [ "$ENVIRONMENT" = "prod" ]; then
            npm run build-only -- --mode prod
          else
            npm run build-only
          fi

      - name: Package dist folder
        run: |
          cd dist
          zip -r ../solar-roof-frontend.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: solar-roof-frontend
          path: solar-roof-frontend.zip
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: solar-roof-frontend

      - name: Unzip artifact
        run: |
          mkdir -p dist
          unzip solar-roof-frontend.zip -d dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && secrets.SFOE_SOLAR_ROOF_PIPELINE_ROLE_PROD || secrets.SFOE_SOLAR_ROOF_PIPELINE_ROLE_DEV }}
          aws-region: eu-central-1

      - name: Deploy to S3
        run: aws s3 sync dist/ "s3://solar-roof-${ENVIRONMENT}-frontend/" --delete

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID="${{ inputs.environment == 'prod' && secrets.SFOE_SOLAR_ROOF_CLOUDFRONT_PROD || secrets.SFOE_SOLAR_ROOF_CLOUDFRONT_DEV }}"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
