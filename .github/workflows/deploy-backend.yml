name: Deploy Backend Lambda

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Lambda code
        run: |
          cd backend
          zip -r ../lambda-pvtarif.zip lambda_function.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SFOE_SOLAR_ROOF_FRONTEND_PIPELINE_ROLE }}
          aws-region: eu-central-1

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name solar-roof-dev-vese-proxy \
            --zip-file fileb://lambda-pvtarif.zip
