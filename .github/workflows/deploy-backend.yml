name: Build, Scan and Push Backend Lambda

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version tag (e.g. 'latest' or 'v1.2.0')"
        required: true
        type: string
        default: "latest"
  push:
    branches:
      - main
    paths:
      - "backend/**"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Package Lambda code
        run: |
          mkdir -p package
          cp backend/lambda_function.py package/lambda_function.py
          cd package
          zip -r ../solar-roof-vese-proxy.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-roof-vese-proxy
          path: solar-roof-vese-proxy.zip
          retention-days: 1

  scan-push:
    needs: build
    uses: SFOE-prometheon/github-terraform-workflows/.github/workflows/s3-artifact-scan-push.yml@v8
    with:
      artifact-name: solar-roof-vese-proxy
      artifact-type: .zip
      tag-name: ${{ inputs.version || 'latest' }}
      s3-bucket: solar-roof-dev-backend-artifact-store
      scan-type: archive
    secrets:
      aws-role: ${{ secrets.SFOE_SOLAR_ROOF_FRONTEND_PIPELINE_ROLE }}
