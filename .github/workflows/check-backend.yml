name: Check Backend

# Syntax check and lint of the VESE proxy Lambda (backend/lambda_function.py). Takes a few seconds.
#
# - On a pull request that touches backend/**: runs on its own.
# - Called by package-and-push-backend.yml: the Lambda is only packaged if this passes.
# It does not run tests (the Lambda has none yet) and does not touch AWS.
#
# Do NOT mark this check as "required" in the branch rules of main: it does not run on pull requests
# that leave backend/ alone, and a required check that never runs blocks the merge.

on:
  pull_request:
    paths:
      - "backend/**"
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Check backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Same Python version as the Lambda runtime (python3.12).
      - name: Syntax check
        run: python -m py_compile backend/lambda_function.py

      # Pinned on purpose: a new ruff release must not break the check by itself.
      - name: Lint (ruff)
        run: |
          python -m pip install --quiet "ruff==0.15.17"
          python -m ruff check backend
